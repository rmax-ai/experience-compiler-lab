<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Experience Compiler Lab pipeline loop</title><desc id="desc">Failure becomes evidence, a hypothesis and patch, then evaluation and a promotion or rejection decision.</desc>
  <rect width="1200" height="520" rx="28" fill="#0f172a"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/></marker><marker id="pass" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker><marker id="fail" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker></defs>
  <g fill="#1e293b" stroke="#334155" stroke-width="2"><rect x="55" y="195" width="140" height="72" rx="12"/><rect x="240" y="195" width="140" height="72" rx="12"/><rect x="425" y="195" width="140" height="72" rx="12"/><rect x="610" y="195" width="140" height="72" rx="12"/><rect x="795" y="195" width="140" height="72" rx="12"/><rect x="980" y="195" width="140" height="72" rx="12"/></g>
  <g fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"><path d="M195 231h45"/><path d="M380 231h45"/><path d="M565 231h45"/><path d="M750 231h45"/><path d="M935 231h45"/></g>
  <g font-family="ui-sans-serif, system-ui" fill="#e2e8f0" text-anchor="middle"><text x="125" y="226" font-size="16">failure</text><text x="125" y="248" font-size="12" fill="#94a3b8">execution trace</text><text x="310" y="226" font-size="16">evidence</text><text x="310" y="248" font-size="12" fill="#94a3b8">observations</text><text x="495" y="226" font-size="16">hypothesis</text><text x="495" y="248" font-size="12" fill="#94a3b8">knowledge record</text><text x="680" y="226" font-size="16">patch</text><text x="680" y="248" font-size="12" fill="#94a3b8">one minimal skill</text><text x="865" y="226" font-size="16">evaluation</text><text x="865" y="248" font-size="12" fill="#94a3b8">identical seeds</text><text x="1050" y="226" font-size="16">decision</text><text x="1050" y="248" font-size="12" fill="#94a3b8">ledger record</text></g>
  <path d="M1050 267v104H125v-104" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#fail)"/><text x="590" y="401" fill="#ef4444" font-family="ui-sans-serif, system-ui" font-size="14" text-anchor="middle">reject → capture the next failure</text>
  <path d="M1050 195V92H680v103" fill="none" stroke="#22c55e" stroke-width="3" marker-end="url(#pass)"/><text x="865" y="74" fill="#22c55e" font-family="ui-sans-serif, system-ui" font-size="14" text-anchor="middle">promote → deploy the reversible skill</text>
</svg>
