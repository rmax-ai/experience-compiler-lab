[project]
name = "experience-compiler"
version = "0.1.0"
description = "Agent Experience Compiler: turn execution traces into validated procedural skills"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rmax-ai" }]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
exp = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent",
    "src/world",
    "src/traces",
    "src/knowledge",
    "src/skills",
    "src/evals",
    "src/experiments",
    "src/cli",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
